springdoc:
  swagger-ui:
    url: /openapi.yaml

spring:
  datasource:
    url: jdbc:h2:file:./data/sampledb;AUTO_SERVER=TRUE
    driverClassName: org.h2.Driver
    username: user
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID:OAUTH_ID}
            client-secret: ${GITHUB_CLIENT_SECRET:SOME_OAUTH_SECRET}
            authorization-grant-type: client_credentials
            scope: read:user, repo

token:
  github-pat: ${GITHUB_PAT:THE_UNAMUR_PAT}
  backend-token: ${BACKEND_TOKEN:SOME_BACKEND_TOKEN}
  frontend-token: ${FRONTEND_TOKEN:}
  sonar-token: ${SONAR_TOKEN:SOME_UNAMUR_TOKEN}

app:
  url: ${APP_URL:YOURS_OR_NGROK} # Used to expose the backend URL to the frontend and the git worker
#  url: ${APP_URL:http://localhost:8080}
  github-url: 'https://api.github.com'
  github-owner: ${APP_GITHUB_OWNER:blade-runner-unamur}
  github-worker-repo: ${APP_GITHUB_WORKER_REPO:blade-runner-worker}
  sonar-component-key: ${APP_SONAR_COMPONENT_KEY:blade-runner-unamur}
