services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: blade-runner-server:local
    container_name: blade-runner-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_TOOL_OPTIONS: "-Xms256m -Xmx768m"
    volumes:
      - backend_data:/app/data
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nginx-network}

volumes:
  backend_data:
